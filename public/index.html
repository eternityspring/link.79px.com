<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>link.79px.com · 好工具，随手可达</title>
  <meta name="description" content="烁皓的精选工具导航。按分类发现 AI 工具、GPU 算力、云服务器和更多实用服务，一键访问、复制短链与推荐码。">
  <meta name="author" content="eternityspring">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://link.79px.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="link.79px.com · 好工具，随手可达">
  <meta property="og:description" content="AI 工具、GPU 算力、云服务器与更多实用服务，按分类轻松发现。">
  <meta property="og:url" content="https://link.79px.com/">
  <meta property="og:image" content="https://link.79px.com/og-image.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:creator" content="@eternityspring">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script>
    try {
      const preference = localStorage.getItem('link-hao-theme') || 'system';
      document.documentElement.dataset.theme = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    } catch {}
  </script>
  <link rel="stylesheet" href="/directory.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip">跳至资源列表</a>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="link.79px.com">
        <span class="brand-mark">↗</span>
        <span><strong>link<span>.</span></strong><small>79px.com</small></span>
      </a>
      <div class="nav-label"><span data-i18n="browse">浏览分类</span><span class="tiny-label">EXPLORE</span></div>
      <nav id="categories" class="category-nav" aria-label="资源分类"></nav>
      <div class="sidebar-note">
        <span class="status-dot"></span><span data-i18n="curated">好用的，才收录。</span>
        <p data-i18n="sidebarNote">给每个值得收藏的工具，一个更近的入口。</p>
      </div>
      <a class="back-home" href="https://79px.com" target="_blank" rel="noopener noreferrer"><span data-i18n="home">烁皓的个人主页</span><span aria-hidden="true">↗</span></a>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb"><span class="breadcrumb-dot"></span><span data-i18n="directory">精选工具导航</span><span class="topbar-caption">/ RESOURCE DIRECTORY</span></div>
        <div class="preferences">
          <div class="toggle-group" role="group" aria-label="Language">
            <button type="button" data-lang="zh" aria-label="中文" aria-pressed="false">中</button>
            <button type="button" data-lang="en" aria-label="English" aria-pressed="false">EN</button>
          </div>
          <div class="toggle-group themes" role="group" aria-label="Theme">
            <button type="button" data-theme-value="light" aria-label="浅色模式" title="浅色模式"></button>
            <button type="button" data-theme-value="dark" aria-label="深色模式" title="深色模式"></button>
            <button type="button" data-theme-value="system" aria-label="跟随系统" title="跟随系统"></button>
          </div>
        </div>
      </header>
      <main id="main" tabindex="-1">
        <section class="hero" aria-labelledby="heroTitle">
          <div>
            <p class="eyebrow"><span aria-hidden="true">✳</span><span data-i18n="eyebrow">少一点寻找，多一点创造</span></p>
            <h1 id="heroTitle"><span data-i18n="headline">好工具，</span><em data-i18n="headlineAccent">随手可达。</em></h1>
            <p class="intro" data-i18n="intro">从灵感到上线，找到你需要的下一件工具。</p>
          </div>
          <div class="collection-stats" aria-label="资源概览">
            <div><strong id="totalCount">—</strong><span data-i18n="resources">精选资源</span></div>
            <div><strong id="categoryCount">—</strong><span data-i18n="categories">实用分类</span></div>
          </div>
        </section>
        <div class="search-wrap">
          <span id="searchIcon" aria-hidden="true"></span>
          <input id="search" type="search" autocomplete="off" aria-label="搜索资源" placeholder="搜索工具、关键词或推荐码…">
          <button id="clearSearch" class="clear-search" type="button" hidden aria-label="清空搜索">×</button>
          <kbd class="search-shortcut" aria-hidden="true">/</kbd>
        </div>
        <section class="collection" aria-labelledby="collectionTitle">
          <div class="collection-heading">
            <div><span class="section-mark" aria-hidden="true"></span><h2 id="collectionTitle">全部资源</h2><span id="visibleCount" class="result-count">—</span></div>
            <button id="resetFilters" class="text-button" type="button" data-i18n="reset" hidden>重置筛选</button>
            <span id="collectionHint" class="collection-hint" data-i18n="collectionHint">为你的下一次创造，准备就绪</span>
          </div>
          <p id="resultAnnouncement" class="sr-only" role="status" aria-live="polite"></p>
          <div id="links" class="links" aria-busy="true"><p class="empty-state">正在加载资源…</p></div>
        </section>
        <noscript><p class="empty-state">请启用 JavaScript 查看资源目录。已有短链接仍可直接访问。</p></noscript>
      </main>
      <footer>
        <div class="footer-inner">
          <span>Curated by <a href="https://x.com/eternityspring" target="_blank" rel="noopener noreferrer">烁皓<span class="footer-star" aria-hidden="true">✳</span></a></span>
          <div class="footer-links">
            <a href="https://github.com/eternityspring/link.79px.com" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
            <a href="https://x.com/eternityspring" target="_blank" rel="noopener noreferrer">X ↗</a>
            <a href="mailto:eternityspring@gmail.com" data-i18n="contact">联系我 ↗</a>
          </div>
        </div>
      </footer>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
